name: Build iOS App (IPA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build iOS Application (Unsigned IPA)
      run: |
        if [ -d "ios-app" ]; then
          cd ios-app
        fi
        
        xcodebuild -project SleepysBackscreen.xcodeproj \
          -scheme SleepysBackscreen \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
          clean build

        # Package into IPA
        mkdir -p Payload
        cp -r build/Release-iphoneos/SleepysBackscreen.app Payload/
        zip -r SleepysBackscreen.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SleepysBackscreen-iOS-IPA
        path: |
          **/SleepysBackscreen.ipa
